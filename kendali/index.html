<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pusat Kendali — Rushtic</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Fraunces:opsz,wght@9..144,400;9..144,600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0e1317; --panel:#161c22; --panel2:#1c242c; --line:#26313b;
  --gold:#d4af37; --gold-dim:#8a7328; --gold-soft:rgba(212,175,55,.12);
  --ink:#e9edf1; --muted:#8b98a6; --faint:#5b6773;
  --ok:#3fb950; --warn:#e0a72c; --bad:#f0564a;
  --r:14px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink);
  font-family:'Plus Jakarta Sans',system-ui,sans-serif;
  font-size:15px; line-height:1.5;
  padding-bottom:calc(76px + env(safe-area-inset-bottom));
  -webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font-family:inherit;font-size:inherit}
a{color:var(--gold);text-decoration:none}

/* ---------- header ---------- */
header{
  position:sticky;top:0;z-index:40;
  background:rgba(14,19,23,.92);backdrop-filter:blur(12px);
  border-bottom:1px solid var(--line);
  padding:calc(12px + env(safe-area-inset-top)) 16px 12px;
  display:flex;align-items:center;gap:10px;
}
.wordmark{font-family:'Fraunces',serif;font-size:19px;letter-spacing:.2px}
.wordmark b{color:var(--gold);font-weight:600}
.spacer{flex:1}
.sync{
  border:1px solid var(--line);background:var(--panel);color:var(--muted);
  padding:7px 12px;border-radius:99px;font-size:12px;font-weight:600;
  display:flex;align-items:center;gap:6px;cursor:pointer;
}
.sync.live{color:var(--ok);border-color:rgba(63,185,80,.3)}
.sync.off{color:var(--bad);border-color:rgba(240,86,74,.3)}
.dot{width:6px;height:6px;border-radius:99px;background:currentColor}

main{padding:16px 16px 24px;max-width:720px;margin:0 auto}
.view{display:none}
.view.on{display:block;animation:fade .25s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* ---------- type ---------- */
.eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);font-weight:700;margin:22px 0 10px}
.eyebrow:first-child{margin-top:4px}
h2{font-family:'Fraunces',serif;font-weight:600;font-size:24px;margin:0 0 4px}
.sub{color:var(--muted);font-size:13px;margin:0 0 16px}

/* ---------- cards ---------- */
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:10px}
.card.tap{cursor:pointer;transition:border-color .15s,transform .1s}
.card.tap:active{transform:scale(.99)}
.card.tap:hover{border-color:var(--gold-dim)}

.row{display:flex;align-items:center;gap:10px}
.grow{flex:1;min-width:0}
.truncate{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.name{font-weight:700;font-size:15px}
.meta{color:var(--muted);font-size:12.5px;margin-top:2px}
.money{font-variant-numeric:tabular-nums;font-weight:700}

.pill{font-size:10.5px;font-weight:700;padding:3px 8px;border-radius:99px;letter-spacing:.03em;white-space:nowrap}
.p-lead{background:rgba(139,152,166,.16);color:#a9b6c4}
.p-survey{background:rgba(88,166,255,.15);color:#6cb6ff}
.p-penawaran{background:rgba(224,167,44,.15);color:var(--warn)}
.p-dp{background:var(--gold-soft);color:var(--gold)}
.p-lunas{background:rgba(63,185,80,.15);color:var(--ok)}
.p-selesai{background:rgba(91,103,115,.18);color:var(--faint)}

/* ---------- action strip (signature) ---------- */
.today{
  background:linear-gradient(160deg,#1d2530,#151b21);
  border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:18px;
  position:relative;overflow:hidden;
}
.today::after{content:"";position:absolute;inset:0 auto 0 0;width:3px;background:linear-gradient(180deg,var(--gold),transparent)}
.today .big{font-family:'Fraunces',serif;font-size:38px;line-height:1;color:var(--gold)}
.today .lbl{font-size:12.5px;color:var(--muted);margin-top:6px}

.task{display:flex;gap:11px;align-items:flex-start;padding:11px 0;border-bottom:1px solid var(--line)}
.task:last-child{border-bottom:0;padding-bottom:0}
.tick{
  width:21px;height:21px;flex:0 0 21px;margin-top:1px;border-radius:6px;
  border:1.5px solid var(--faint);background:transparent;cursor:pointer;
  display:flex;align-items:center;justify-content:center;color:transparent;font-size:12px;font-weight:800;
}
.tick:hover{border-color:var(--gold)}
.tick.done{background:var(--gold);border-color:var(--gold);color:#0e1317}
.task .t1{font-size:14px;font-weight:600}
.task .t2{font-size:12px;color:var(--muted);margin-top:1px}
.task.late .t2{color:var(--bad)}
.task.soon .t2{color:var(--warn)}
.task.done .t1{color:var(--faint);text-decoration:line-through}

/* ---------- journey spine ---------- */
.phase{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--gold);font-weight:800;margin:18px 0 8px;display:flex;align-items:center;gap:8px}
.phase::after{content:"";flex:1;height:1px;background:var(--line)}
.spine{position:relative;padding-left:26px}
.spine::before{content:"";position:absolute;left:9px;top:6px;bottom:6px;width:1.5px;background:var(--line)}
.step{position:relative;padding:9px 0}
.step::before{
  content:"";position:absolute;left:-22px;top:15px;width:11px;height:11px;border-radius:99px;
  background:var(--bg);border:1.5px solid var(--faint);
}
.step.done::before{background:var(--gold);border-color:var(--gold)}
.step.late::before{border-color:var(--bad);background:var(--bad)}
.step .sr{display:flex;align-items:center;gap:10px}
.step .st{font-size:14px;font-weight:600;flex:1}
.step.done .st{color:var(--faint);text-decoration:line-through}
.step .sd{font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.step.late .sd{color:var(--bad);font-weight:700}
.step.today-mark::before{box-shadow:0 0 0 4px var(--gold-soft)}

.progress{height:5px;background:var(--panel2);border-radius:99px;overflow:hidden;margin-top:10px}
.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--gold-dim),var(--gold));border-radius:99px;transition:width .4s}

/* ---------- buttons ---------- */
.btn{
  border:0;border-radius:11px;padding:12px 16px;font-weight:700;font-size:14px;cursor:pointer;
  background:var(--gold);color:#12181d;width:100%;
}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--ink)}
.btn.wa{background:#1f8a4c;color:#fff}
.btn.sm{padding:9px 12px;font-size:13px;width:auto}
.btns{display:flex;gap:8px;margin-top:12px}
.btns .btn{width:auto;flex:1}

/* ---------- forms ---------- */
label{display:block;font-size:11.5px;font-weight:700;color:var(--muted);margin:12px 0 5px;letter-spacing:.03em}
input,select,textarea{
  width:100%;background:var(--panel2);border:1px solid var(--line);color:var(--ink);
  border-radius:10px;padding:11px 12px;outline:none;
}
input:focus,select:focus,textarea:focus{border-color:var(--gold-dim)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* ---------- sheet ---------- */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:60;display:none}
.scrim.on{display:block}
.sheet{
  position:fixed;left:0;right:0;bottom:0;z-index:70;
  background:var(--panel);border-radius:20px 20px 0 0;border-top:1px solid var(--line);
  padding:18px 16px calc(20px + env(safe-area-inset-bottom));
  max-height:88vh;overflow-y:auto;transform:translateY(102%);transition:transform .28s cubic-bezier(.2,.8,.2,1);
  max-width:720px;margin:0 auto;
}
.sheet.on{transform:none}
.grab{width:38px;height:4px;background:var(--line);border-radius:99px;margin:0 auto 14px}
.sheet h3{font-family:'Fraunces',serif;font-weight:600;font-size:20px;margin:0 0 2px}

/* ---------- nav ---------- */
nav{
  position:fixed;left:0;right:0;bottom:0;z-index:50;
  background:rgba(18,24,29,.96);backdrop-filter:blur(14px);border-top:1px solid var(--line);
  display:flex;padding:8px 4px calc(8px + env(safe-area-inset-bottom));
}
nav button{
  flex:1;background:none;border:0;color:var(--faint);cursor:pointer;
  display:flex;flex-direction:column;align-items:center;gap:3px;padding:4px;font-size:10.5px;font-weight:700;
}
nav button svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav button.on{color:var(--gold)}

/* ---------- misc ---------- */
.empty{text-align:center;padding:34px 18px;color:var(--muted)}
.empty .em{font-family:'Fraunces',serif;font-size:17px;color:var(--ink);margin-bottom:6px}
.stat{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.stat .card{margin:0;padding:13px}
.stat .v{font-family:'Fraunces',serif;font-size:22px;font-variant-numeric:tabular-nums}
.stat .k{font-size:11px;color:var(--muted);margin-top:2px}
.in{color:var(--ok)} .out{color:var(--bad)}
.filters{display:flex;gap:7px;overflow-x:auto;padding-bottom:4px;margin-bottom:12px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.chip{border:1px solid var(--line);background:var(--panel);color:var(--muted);padding:7px 13px;border-radius:99px;font-size:12.5px;font-weight:600;white-space:nowrap;cursor:pointer}
.chip.on{background:var(--gold-soft);border-color:var(--gold-dim);color:var(--gold)}
.toast{
  position:fixed;left:50%;bottom:92px;transform:translateX(-50%) translateY(20px);
  background:var(--panel2);border:1px solid var(--gold-dim);color:var(--ink);
  padding:11px 18px;border-radius:99px;font-size:13px;font-weight:600;z-index:90;
  opacity:0;pointer-events:none;transition:.25s;white-space:nowrap;
}
.toast.on{opacity:1;transform:translateX(-50%)}
.led{display:flex;justify-content:space-between;align-items:center;padding:11px 0;border-bottom:1px solid var(--line)}
.led:last-child{border-bottom:0}
</style>
</head>
<body>

<header>
  <div class="wordmark">Pusat <b>Kendali</b></div>
  <div class="spacer"></div>
  <button class="sync" id="syncBtn" onclick="pull()"><span class="dot"></span><span id="syncTxt">Hubungkan</span></button>
</header>

<main>

<!-- ============ BERANDA ============ -->
<section class="view on" id="v-beranda">
  <div class="today">
    <div class="big" id="dueCount">0</div>
    <div class="lbl" id="dueLabel">langkah menunggu kamu hari ini</div>
  </div>

  <div class="eyebrow">Harus dikerjakan</div>
  <div id="taskList"></div>

  <div class="eyebrow">Acara terdekat</div>
  <div id="upcoming"></div>
</section>

<!-- ============ KLIEN ============ -->
<section class="view" id="v-klien">
  <h2>Klien</h2>
  <p class="sub" id="klienSub">—</p>
  <div class="filters" id="stageFilters"></div>
  <div id="clientList"></div>
  <button class="btn" style="margin-top:14px" onclick="openNewLead()">+ Lead baru</button>
</section>

<!-- ============ UANG ============ -->
<section class="view" id="v-uang">
  <h2>Uang</h2>
  <p class="sub">Tercatat otomatis begitu langkah pembayaran kamu centang.</p>
  <div class="stat">
    <div class="card"><div class="v in" id="fIn">Rp 0</div><div class="k">Masuk bulan ini</div></div>
    <div class="card"><div class="v out" id="fOut">Rp 0</div><div class="k">Keluar bulan ini</div></div>
  </div>
  <div class="card">
    <div class="row"><div class="grow"><div class="meta">Sisa tagihan belum tertagih</div>
    <div class="v money" style="font-size:20px" id="fPiutang">Rp 0</div></div></div>
  </div>
  <div class="eyebrow">Riwayat</div>
  <div class="card" id="ledgerList"></div>
  <button class="btn ghost" style="margin-top:12px" onclick="openEntry()">+ Catat manual</button>
</section>

<!-- ============ EVENT ============ -->
<section class="view" id="v-event">
  <h2>Event</h2>
  <p class="sub">Yang sudah deal — dari persiapan sampai LPJ.</p>
  <div id="eventList"></div>
</section>

</main>

<nav>
  <button class="on" data-v="beranda" onclick="go('beranda')">
    <svg viewBox="0 0 24 24"><path d="M3 10l9-7 9 7v10a2 2 0 01-2 2H5a2 2 0 01-2-2z"/></svg>Beranda</button>
  <button data-v="klien" onclick="go('klien')">
    <svg viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 00-4-4H6a4 4 0 00-4 4v2"/><circle cx="9.5" cy="7" r="4"/><path d="M22 21v-2a4 4 0 00-3-3.87"/></svg>Klien</button>
  <button data-v="event" onclick="go('event')">
    <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>Event</button>
  <button data-v="uang" onclick="go('uang')">
    <svg viewBox="0 0 24 24"><path d="M12 1v22"/><path d="M17 5H9.5a3.5 3.5 0 000 7h5a3.5 3.5 0 010 7H6"/></svg>Uang</button>
</nav>

<div class="scrim" id="scrim" onclick="closeSheet()"></div>
<div class="sheet" id="sheet"><div class="grab"></div><div id="sheetBody"></div></div>
<div class="toast" id="toast"></div>

<script>
/* =====================================================================
   PUSAT KENDALI — RUSHTIC
   Satu record klien, banyak tampilan. Data di Firebase RTDB rushtic-deco.
     /crm/{id}            <- data klien (dipakai bareng CRM lama, TIDAK diubah strukturnya)
     /kendali/journey/{id} <- centang langkah customer journey
     /kendali/ledger/{id}  <- catatan uang
     /kendali/evaluasi/{id}<- catatan LPJ & evaluasi
   ===================================================================== */

const DB = 'https://rushtic-deco-default-rtdb.firebaseio.com';

let clients = {};      // id -> client
let journey = {};      // clientId -> {stepId: {done, at}}
let ledger  = {};      // id -> entry
let evals   = {};      // clientId -> {catatan, nilai}
let online  = false;
let filterStage = 'aktif';

/* ---------- helper ---------- */
const $  = s => document.querySelector(s);
const el = (t,c,h)=>{const n=document.createElement(t); if(c)n.className=c; if(h!=null)n.innerHTML=h; return n;};
const rp = n => 'Rp ' + (Number(n)||0).toLocaleString('id-ID');
const DAY = 86400000;
const today = () => { const d=new Date(); d.setHours(0,0,0,0); return d; };
const parseD = s => { if(!s) return null; const d=new Date(s); return isNaN(d)?null:(d.setHours(0,0,0,0),d); };
const fmtD = d => d ? d.toLocaleDateString('id-ID',{day:'numeric',month:'short',year:'2-digit'}) : '—';
const daysTo = d => d ? Math.round((d - today())/DAY) : null;
function rel(d){
  const n = daysTo(d);
  if(n===null) return 'tanpa tanggal';
  if(n===0) return 'hari ini';
  if(n===1) return 'besok';
  if(n===-1) return 'kemarin';
  return n<0 ? `telat ${-n} hari` : `${n} hari lagi`;
}
function toast(m){ const t=$('#toast'); t.textContent=m; t.classList.add('on'); setTimeout(()=>t.classList.remove('on'),2200); }
function waLink(no,txt){
  let n=(no||'').replace(/\D/g,'');
  if(n.startsWith('0')) n='62'+n.slice(1);
  if(!n.startsWith('62')) n='62'+n;
  return `https://wa.me/${n}?text=${encodeURIComponent(txt||'')}`;
}

/* =====================================================================
   CUSTOMER JOURNEY — dibangun otomatis dari tanggal lead & tanggal acara
   ===================================================================== */
const TPL = [
  // id,        label,                                  fase,          jangkar,  offset hari
  ['balas',     'Balas lead (< 1 jam)',                 'Pra-deal',    'lead',    0],
  ['fu1',       'Follow-up pertama',                    'Pra-deal',    'lead',    1],
  ['survey',    'Survey / ketemu klien',                'Pra-deal',    'lead',    3],
  ['penawaran', 'Kirim penawaran + moodboard',          'Pra-deal',    'lead',    5],
  ['fu2',       'Follow-up penawaran',                  'Pra-deal',    'lead',    8],
  ['closing',   'Closing & DP masuk',                   'Pra-deal',    'lead',   14, 'uang-dp'],

  ['kontrak',   'Kontrak ditandatangani',               'Persiapan',   'acara', -90],
  ['konsep',    'Konsep & moodboard disetujui',         'Persiapan',   'acara', -60],
  ['vendor',    'Kunci vendor (dekor, katering, dok.)', 'Persiapan',   'acara', -45],
  ['lunas',     'Pelunasan',                            'Persiapan',   'acara', -14, 'uang-lunas'],
  ['tm',        'Technical meeting + rundown final',    'Persiapan',   'acara',  -7],
  ['loading',   'Loading barang & setup',               'Persiapan',   'acara',  -1],

  ['harih',     'Hari acara',                           'Hari-H',      'acara',   0],

  ['dok',       'Serah terima dokumentasi',             'After event', 'acara',   7],
  ['lpj',       'LPJ & evaluasi tim',                   'After event', 'acara',  10, 'evaluasi'],
  ['testi',     'Minta testimoni / review',             'After event', 'acara',  14],

  ['anniv',     'Ucapan + offer anniversary',           'Loyal',       'acara', 365, 'loyal'],
];

function buildJourney(c){
  const lead  = parseD(c.createdAt) || today();
  const acara = parseD(c.date);
  const state = journey[c.id] || {};
  const stageIdx = ['Lead','Survey','Penawaran','DP','Lunas','Selesai'].indexOf(c.stage||'Lead');

  return TPL.map(([id,label,fase,anchor,off,kind])=>{
    const base = anchor==='lead' ? lead : acara;
    const due  = base ? new Date(base.getTime() + off*DAY) : null;
    // langkah pra-deal dianggap selesai kalau stage klien sudah melewatinya
    let auto = false;
    if(anchor==='lead' && stageIdx>=3) auto = true;                  // sudah DP -> pra-deal beres
    if(id==='lunas' && stageIdx>=4) auto = true;
    const done = state[id]?.done ?? auto;
    return {id,label,fase,due,kind,done, at:state[id]?.at||null,
            late: !done && due && daysTo(due)<0};
  });
}
function activeSteps(c){
  // langkah yang relevan: belum selesai, punya tanggal, dan jatuh tempo <= 3 hari lagi
  return buildJourney(c).filter(s=>!s.done && s.due && daysTo(s.due)<=3);
}
function progress(c){
  const j=buildJourney(c).filter(s=>s.id!=='anniv');
  return Math.round(j.filter(s=>s.done).length / j.length * 100);
}

/* =====================================================================
   SINKRONISASI
   ===================================================================== */
async function pull(){
  setSync('…','');
  try{
    const [a,b,d,e] = await Promise.all([
      fetch(`${DB}/crm.json`).then(r=>r.json()),
      fetch(`${DB}/kendali/journey.json`).then(r=>r.json()),
      fetch(`${DB}/kendali/ledger.json`).then(r=>r.json()),
      fetch(`${DB}/kendali/evaluasi.json`).then(r=>r.json()),
    ]);
    clients = {}; 
    Object.entries(a||{}).forEach(([id,v])=>{ if(v&&v.name) clients[id]={...v,id}; });
    journey = b||{}; ledger = d||{}; evals = e||{};
    online = true; setSync('Tersambung','live');
    renderAll();
  }catch(err){
    online=false; setSync('Offline','off');
    toast('Gagal ambil data — cek koneksi');
    renderAll();
  }
}
async function push(path, data){
  if(!online){ toast('Offline — perubahan belum tersimpan'); return; }
  try{
    await fetch(`${DB}/${path}.json`,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});
  }catch(e){ toast('Gagal simpan'); }
}
function setSync(t,cls){ $('#syncTxt').textContent=t; $('#syncBtn').className='sync '+cls; }

/* =====================================================================
   AKSI
   ===================================================================== */
async function toggleStep(cid, sid){
  const c = clients[cid]; if(!c) return;
  const st = buildJourney(c).find(s=>s.id===sid);
  const now = !st.done;
  journey[cid] = journey[cid]||{};
  journey[cid][sid] = {done:now, at:new Date().toISOString()};
  await push(`kendali/journey/${cid}`, {[sid]:journey[cid][sid]});

  if(now && st.kind==='uang-dp')    return askMoney(c,'DP '+c.name, c.dp || Math.round((c.value||0)*.3));
  if(now && st.kind==='uang-lunas') return askMoney(c,'Pelunasan '+c.name, c.remaining || 0);
  if(now && st.kind==='evaluasi')   return openEval(c);
  if(now && st.kind==='loyal')      return openAnniv(c);
  renderAll();
}

function askMoney(c,label,amount){
  openSheet(`
    <h3>Catat pemasukan</h3>
    <p class="sub">Nilai ini langsung masuk ke halaman Uang. Kamu tidak perlu input ulang di mana pun.</p>
    <label>Keterangan</label><input id="mLabel" value="${label}">
    <label>Jumlah masuk</label><input id="mAmt" type="number" inputmode="numeric" value="${amount||0}">
    <div class="btns">
      <button class="btn ghost" onclick="closeSheet();renderAll()">Lewati</button>
      <button class="btn" onclick="saveMoney('${c.id}')">Simpan</button>
    </div>`);
}
async function saveMoney(cid){
  const id = 'e'+Date.now();
  const entry = {clientId:cid, label:$('#mLabel').value, amount:Number($('#mAmt').value)||0,
                 type:'in', date:new Date().toISOString()};
  ledger[id]=entry; await push('kendali/ledger',{[id]:entry});
  closeSheet(); renderAll(); toast('Tercatat di Uang');
}

function openEntry(){
  openSheet(`
    <h3>Catat manual</h3>
    <label>Keterangan</label><input id="mLabel" placeholder="Sewa properti dekor">
    <div class="two">
      <div><label>Jumlah</label><input id="mAmt" type="number" inputmode="numeric" placeholder="0"></div>
      <div><label>Arah</label><select id="mType"><option value="out">Keluar</option><option value="in">Masuk</option></select></div>
    </div>
    <div class="btns">
      <button class="btn ghost" onclick="closeSheet()">Batal</button>
      <button class="btn" onclick="saveEntry()">Simpan</button>
    </div>`);
}
async function saveEntry(){
  const id='e'+Date.now();
  const entry={clientId:null,label:$('#mLabel').value||'Tanpa keterangan',
    amount:Number($('#mAmt').value)||0, type:$('#mType').value, date:new Date().toISOString()};
  ledger[id]=entry; await push('kendali/ledger',{[id]:entry});
  closeSheet(); renderAll(); toast('Tersimpan');
}

function openEval(c){
  const cur = evals[c.id]||{};
  openSheet(`
    <h3>LPJ & evaluasi — ${c.name}</h3>
    <p class="sub">Isi sekarang selagi ingat. Ini yang jadi bahan perbaikan paket berikutnya.</p>
    <label>Yang berjalan baik</label><textarea id="eBaik" rows="2">${cur.baik||''}</textarea>
    <label>Yang meleset</label><textarea id="eBuruk" rows="2">${cur.buruk||''}</textarea>
    <div class="two">
      <div><label>Biaya riil keluar</label><input id="eCost" type="number" inputmode="numeric" value="${cur.cost||''}"></div>
      <div><label>Nilai kepuasan (1-5)</label><input id="eScore" type="number" min="1" max="5" value="${cur.score||''}"></div>
    </div>
    <div class="btns">
      <button class="btn ghost" onclick="closeSheet();renderAll()">Nanti</button>
      <button class="btn" onclick="saveEval('${c.id}')">Simpan</button>
    </div>`);
}
async function saveEval(cid){
  const d={baik:$('#eBaik').value,buruk:$('#eBuruk').value,
           cost:Number($('#eCost').value)||0,score:Number($('#eScore').value)||0,
           at:new Date().toISOString()};
  evals[cid]=d; await push('kendali/evaluasi',{[cid]:d});
  if(d.cost>0){
    const id='e'+Date.now();
    const entry={clientId:cid,label:'Biaya event '+(clients[cid]?.name||''),amount:d.cost,type:'out',date:new Date().toISOString()};
    ledger[id]=entry; await push('kendali/ledger',{[id]:entry});
  }
  closeSheet(); renderAll(); toast('Evaluasi tersimpan');
}

function openAnniv(c){
  const d=parseD(c.date);
  const msg = `Halo ${c.name}! 🤍 Hari ini tepat satu tahun acara kalian bersama Rushtic. Semoga terus bahagia ya.\n\nKalau ada rencana acara keluarga berikutnya — syukuran, lamaran, atau ulang tahun — sebagai klien Rushtic kamu dapat harga khusus alumni. Kabari aja kapan pun. 🙏`;
  openSheet(`
    <h3>Anniversary ${c.name}</h3>
    <p class="sub">${fmtD(d)} · satu tahun lalu</p>
    <label>Pesan</label><textarea id="aMsg" rows="7">${msg}</textarea>
    <div class="btns">
      <button class="btn ghost" onclick="closeSheet();renderAll()">Tutup</button>
      <button class="btn wa" onclick="sendWA('${c.id}')">Kirim WA</button>
    </div>`);
}
function sendWA(cid){ window.open(waLink(clients[cid]?.wa,$('#aMsg').value),'_blank'); closeSheet(); renderAll(); }

/* ---------- lead baru ---------- */
function openNewLead(){
  openSheet(`
    <h3>Lead baru</h3>
    <p class="sub">Begitu tersimpan, perjalanan kliennya langsung terbentuk sendiri.</p>
    <label>Nama</label><input id="nName" placeholder="Nama klien">
    <label>Nomor WhatsApp</label><input id="nWa" inputmode="tel" placeholder="08...">
    <div class="two">
      <div><label>Layanan</label><select id="nBrand"><option>WO</option><option>Dekor</option><option>Wisuda</option><option>MC</option><option>Paket</option></select></div>
      <div><label>Tanggal acara</label><input id="nDate" type="date"></div>
    </div>
    <div class="two">
      <div><label>Perkiraan nilai</label><input id="nValue" type="number" inputmode="numeric" placeholder="0"></div>
      <div><label>Venue</label><input id="nVenue" placeholder="—"></div>
    </div>
    <div class="btns">
      <button class="btn ghost" onclick="closeSheet()">Batal</button>
      <button class="btn" onclick="saveLead()">Simpan lead</button>
    </div>`);
}
async function saveLead(){
  const name=$('#nName').value.trim();
  if(!name){ toast('Nama masih kosong'); return; }
  const id='c'+Date.now();
  const c={name, wa:$('#nWa').value.trim(), brand:$('#nBrand').value, date:$('#nDate').value||'',
    value:Number($('#nValue').value)||0, venue:$('#nVenue').value.trim(), stage:'Lead',
    dp:0, remaining:Number($('#nValue').value)||0, notes:'',
    createdAt:new Date().toISOString(), updatedAt:new Date().toISOString(), lastContact:''};
  clients[id]={...c,id}; await push('crm',{[id]:c});
  closeSheet(); renderAll(); go('klien'); toast('Lead masuk — perjalanan dibuat');
  setTimeout(()=>openClient(id),350);
}

/* ---------- ubah stage ---------- */
async function setStage(cid,stage){
  clients[cid].stage=stage;
  await push(`crm/${cid}`,{stage, updatedAt:new Date().toISOString()});
  renderAll(); openClient(cid);
}

/* =====================================================================
   RENDER
   ===================================================================== */
function renderAll(){ renderBeranda(); renderKlien(); renderEvent(); renderUang(); }

function stagePill(s){
  const k=(s||'Lead').toLowerCase();
  return `<span class="pill p-${k}">${s||'Lead'}</span>`;
}

/* ---- beranda ---- */
function renderBeranda(){
  const list=$('#taskList'); list.innerHTML='';
  let items=[];
  Object.values(clients).forEach(c=>{
    if(c.stage==='Selesai' && !buildJourney(c).some(s=>s.kind==='loyal'&&!s.done&&s.due&&daysTo(s.due)<=3)) {}
    activeSteps(c).forEach(s=>items.push({c,s}));
  });
  items.sort((a,b)=>a.s.due-b.s.due);

  $('#dueCount').textContent=items.length;
  $('#dueLabel').textContent = items.length===0
    ? 'semua langkah beres — nikmati harimu'
    : 'langkah menunggu kamu';

  if(!items.length){
    list.appendChild(el('div','empty','<div class="em">Kosong.</div>Belum ada langkah yang jatuh tempo tiga hari ke depan.'));
  } else {
    const card=el('div','card');
    items.slice(0,12).forEach(({c,s})=>{
      const t=el('div','task '+(s.late?'late':daysTo(s.due)<=1?'soon':''));
      t.innerHTML=`<button class="tick" onclick="event.stopPropagation();toggleStep('${c.id}','${s.id}')">✓</button>
        <div class="grow" onclick="openClient('${c.id}')">
          <div class="t1">${s.label}</div>
          <div class="t2">${c.name} · ${rel(s.due)}</div>
        </div>`;
      card.appendChild(t);
    });
    list.appendChild(card);
  }

  const up=$('#upcoming'); up.innerHTML='';
  const ev=Object.values(clients)
    .filter(c=>parseD(c.date)&&daysTo(parseD(c.date))>=0&&['DP','Lunas'].includes(c.stage))
    .sort((a,b)=>parseD(a.date)-parseD(b.date)).slice(0,3);
  if(!ev.length) up.appendChild(el('div','empty','Belum ada acara terjadwal.'));
  ev.forEach(c=>{
    const d=parseD(c.date);
    const card=el('div','card tap');
    card.onclick=()=>openClient(c.id);
    card.innerHTML=`<div class="row"><div class="grow">
        <div class="name">${c.name}</div>
        <div class="meta">${fmtD(d)} · ${rel(d)} · ${c.venue||'venue belum fix'}</div>
      </div>${stagePill(c.stage)}</div>
      <div class="progress"><i style="width:${progress(c)}%"></i></div>`;
    up.appendChild(card);
  });
}

/* ---- klien ---- */
const STAGES=['aktif','Lead','Survey','Penawaran','DP','Lunas','Selesai'];
function renderKlien(){
  const f=$('#stageFilters'); f.innerHTML='';
  STAGES.forEach(s=>{
    const b=el('button','chip'+(filterStage===s?' on':''), s==='aktif'?'Aktif':s);
    b.onclick=()=>{filterStage=s;renderKlien();};
    f.appendChild(b);
  });
  const all=Object.values(clients);
  const list=all.filter(c=> filterStage==='aktif' ? c.stage!=='Selesai' : c.stage===filterStage)
    .sort((a,b)=>(parseD(a.date)||9e15)-(parseD(b.date)||9e15));

  const pipeline=all.filter(c=>!['Selesai'].includes(c.stage)).reduce((s,c)=>s+(Number(c.value)||0),0);
  $('#klienSub').textContent=`${all.length} klien · nilai pipeline ${rp(pipeline)}`;

  const box=$('#clientList'); box.innerHTML='';
  if(!list.length){ box.appendChild(el('div','empty','<div class="em">Belum ada di tahap ini.</div>')); return; }
  list.forEach(c=>{
    const next=activeSteps(c)[0] || buildJourney(c).find(s=>!s.done);
    const card=el('div','card tap');
    card.onclick=()=>openClient(c.id);
    card.innerHTML=`<div class="row">
        <div class="grow"><div class="name truncate">${c.name}</div>
        <div class="meta truncate">${c.brand||'—'} · ${c.date?fmtD(parseD(c.date)):'tanggal belum fix'}</div></div>
        ${stagePill(c.stage)}</div>
      <div class="progress"><i style="width:${progress(c)}%"></i></div>
      <div class="meta" style="margin-top:8px;color:${next&&next.late?'var(--bad)':'var(--muted)'}">
        ${next?`Berikutnya: ${next.label} · ${rel(next.due)}`:'Semua langkah selesai'}</div>`;
    box.appendChild(card);
  });
}

/* ---- detail klien ---- */
function openClient(id){
  const c=clients[id]; if(!c) return;
  const j=buildJourney(c);
  let html=`<h3>${c.name}</h3>
    <p class="sub">${c.brand||'—'} · ${c.venue||'venue belum fix'} · ${c.date?fmtD(parseD(c.date)):'tanggal belum fix'}</p>
    <div class="stat">
      <div class="card"><div class="v money">${rp(c.value)}</div><div class="k">Nilai</div></div>
      <div class="card"><div class="v money" style="color:var(--warn)">${rp(c.remaining)}</div><div class="k">Sisa</div></div>
    </div>
    <label>Tahap</label>
    <select onchange="setStage('${id}',this.value)">
      ${['Lead','Survey','Penawaran','DP','Lunas','Selesai'].map(s=>`<option ${c.stage===s?'selected':''}>${s}</option>`).join('')}
    </select>
    <div class="btns">
      <button class="btn wa" onclick="window.open('${waLink(c.wa,'Halo '+c.name+', ')}','_blank')">Chat WA</button>
      <button class="btn ghost" onclick="downloadICS('${id}')">Ekspor ke kalender</button>
    </div>`;

  let fase='';
  html+='<div style="margin-top:6px">';
  j.forEach(s=>{
    if(s.fase!==fase){ fase=s.fase; html+=`</div><div class="phase">${fase}</div><div class="spine">`; }
    const cls=[s.done?'done':'', s.late?'late':'', daysTo(s.due)===0?'today-mark':''].join(' ');
    html+=`<div class="step ${cls}"><div class="sr">
        <button class="tick ${s.done?'done':''}" onclick="toggleStep('${id}','${s.id}');closeSheet()">✓</button>
        <div class="st">${s.label}</div><div class="sd">${s.due?fmtD(s.due):'—'}</div>
      </div></div>`;
  });
  html+='</div>';

  const ev=evals[id];
  if(ev) html+=`<div class="phase">Catatan evaluasi</div>
    <div class="card"><div class="meta"><b style="color:var(--ok)">Baik:</b> ${ev.baik||'—'}</div>
    <div class="meta" style="margin-top:6px"><b style="color:var(--bad)">Meleset:</b> ${ev.buruk||'—'}</div>
    <div class="meta" style="margin-top:6px">Biaya riil ${rp(ev.cost)} · kepuasan ${ev.score||'—'}/5</div></div>`;

  openSheet(html);
}

/* ---- ics ---- */
function downloadICS(id){
  const c=clients[id]; const j=buildJourney(c).filter(s=>!s.done&&s.due);
  let ics='BEGIN:VCALENDAR\nVERSION:2.0\nPRODID:-//Rushtic//Kendali//ID\n';
  j.forEach(s=>{
    const d=s.due.toISOString().slice(0,10).replace(/-/g,'');
    ics+=`BEGIN:VEVENT\nUID:${id}-${s.id}@rushtic\nDTSTART;VALUE=DATE:${d}\nSUMMARY:${s.label} — ${c.name}\n`+
         `DESCRIPTION:Klien ${c.name} (${c.wa||'-'})\\nTahap ${c.stage}\\nBuka rushticwojogja.com/kendali\n`+
         `BEGIN:VALARM\nTRIGGER:-PT9H\nACTION:DISPLAY\nDESCRIPTION:${s.label}\nEND:VALARM\nEND:VEVENT\n`;
  });
  ics+='END:VCALENDAR';
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([ics],{type:'text/calendar'}));
  a.download=`kendali-${c.name.replace(/\s+/g,'-').toLowerCase()}.ics`; a.click();
  toast('Buka file-nya untuk masuk kalender');
}

/* ---- event ---- */
function renderEvent(){
  const box=$('#eventList'); box.innerHTML='';
  const list=Object.values(clients).filter(c=>['DP','Lunas','Selesai'].includes(c.stage))
    .sort((a,b)=>(parseD(b.date)||0)-(parseD(a.date)||0));
  if(!list.length){ box.appendChild(el('div','empty','<div class="em">Belum ada event.</div>Klien yang sudah DP muncul di sini.')); return; }
  list.forEach(c=>{
    const j=buildJourney(c);
    const sisa=j.filter(s=>!s.done&&s.fase!=='Loyal').length;
    const card=el('div','card tap'); card.onclick=()=>openClient(c.id);
    card.innerHTML=`<div class="row"><div class="grow">
        <div class="name truncate">${c.name}</div>
        <div class="meta">${fmtD(parseD(c.date))} · ${c.venue||'—'}</div></div>${stagePill(c.stage)}</div>
      <div class="progress"><i style="width:${progress(c)}%"></i></div>
      <div class="meta" style="margin-top:8px">${sisa?sisa+' langkah belum beres':'Tuntas — tinggal anniversary'}${evals[c.id]?' · LPJ ada':''}</div>`;
    box.appendChild(card);
  });
}

/* ---- uang ---- */
function renderUang(){
  const now=new Date(), m=now.getMonth(), y=now.getFullYear();
  let inn=0,out=0;
  const ents=Object.entries(ledger).map(([id,e])=>({...e,id}))
    .sort((a,b)=>new Date(b.date)-new Date(a.date));
  ents.forEach(e=>{ const d=new Date(e.date);
    if(d.getMonth()===m&&d.getFullYear()===y){ e.type==='in'?inn+=e.amount:out+=e.amount; } });
  $('#fIn').textContent=rp(inn); $('#fOut').textContent=rp(out);
  const piutang=Object.values(clients).filter(c=>['DP','Lunas'].includes(c.stage))
    .reduce((s,c)=>s+(Number(c.remaining)||0),0);
  $('#fPiutang').textContent=rp(piutang);

  const box=$('#ledgerList'); box.innerHTML='';
  if(!ents.length){ box.innerHTML='<div class="empty">Belum ada catatan. Centang langkah pembayaran di klien — angkanya masuk sendiri ke sini.</div>'; return; }
  ents.slice(0,25).forEach(e=>{
    const r=el('div','led');
    r.innerHTML=`<div class="grow"><div style="font-size:14px;font-weight:600">${e.label}</div>
      <div class="meta">${new Date(e.date).toLocaleDateString('id-ID',{day:'numeric',month:'short'})}</div></div>
      <div class="money ${e.type==='in'?'in':'out'}">${e.type==='in'?'+':'−'} ${rp(e.amount)}</div>`;
    box.appendChild(r);
  });
}

/* ---- nav & sheet ---- */
function go(v){
  document.querySelectorAll('.view').forEach(s=>s.classList.remove('on'));
  $('#v-'+v).classList.add('on');
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.v===v));
  window.scrollTo({top:0,behavior:'smooth'});
}
function openSheet(h){ $('#sheetBody').innerHTML=h; $('#scrim').classList.add('on'); setTimeout(()=>$('#sheet').classList.add('on'),10); }
function closeSheet(){ $('#sheet').classList.remove('on'); setTimeout(()=>$('#scrim').classList.remove('on'),260); }

pull();
</script>
</body>
</html>
