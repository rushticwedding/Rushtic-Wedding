<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Undangan Pernikahan Aris & Rosi</title>
  <meta http-equiv="refresh" content="0; url=https://invitationrosiaris.lovable.app/">
  <link rel="canonical" href="https://invitationrosiaris.lovable.app/">
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{
      min-height:100vh;display:flex;align-items:center;justify-content:center;
      background:#f8f4ef;font-family:'Georgia',serif;text-align:center;padding:2rem;
    }
    .wrap{max-width:360px}
    .monogram{font-size:4rem;color:#c9a96e;letter-spacing:.1em;margin-bottom:.5rem}
    .names{font-size:1.4rem;color:#5c4a32;letter-spacing:.15em;margin-bottom:.3rem}
    .div{color:#c9a96e;margin:1rem 0;letter-spacing:.3em;font-size:.8rem}
    p{color:#8a7560;font-size:.85rem;line-height:1.7}
    .dot{display:inline-block;width:8px;height:8px;background:#c9a96e;border-radius:50%;
         animation:pulse 1.2s ease-in-out infinite}
    .dot:nth-child(2){animation-delay:.2s}
    .dot:nth-child(3){animation-delay:.4s}
    .dots{margin-top:1.5rem;display:flex;gap:8px;justify-content:center}
    @keyframes pulse{0%,100%{opacity:.3;transform:scale(.8)}50%{opacity:1;transform:scale(1)}}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="monogram">A &amp; R</div>
    <div class="names">ARIS &amp; ROSI</div>
    <div class="div">— ✦ —</div>
    <p>Membuka undangan<br>pernikahan kami untukmu…</p>
    <div class="dots">
      <div class="dot"></div>
      <div class="dot"></div>
      <div class="dot"></div>
    </div>
  </div>
  <script>
    // Redirect instan + bawa query string (untuk fitur nama tamu personal)
    var dest = 'https://invitationrosiaris.lovable.app/';
    var qs = window.location.search;
    if(qs) dest += qs;
    window.location.replace(dest);
  </script>
</body>
</html>
