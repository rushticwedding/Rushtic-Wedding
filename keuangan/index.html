<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"/>
  <meta name="theme-color" content="#2D1B6B"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <meta name="apple-mobile-web-app-title" content="Keuangan"/>
  <link rel="manifest" href="/keuangan/manifest.json"/>
  <title>Keuangan Rushtic</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
    body{font-family:'Segoe UI',system-ui,sans-serif;background:#F7F8FA;min-height:100vh;max-width:480px;margin:0 auto;}
    button{font-family:inherit;cursor:pointer;}
    input,select{font-family:inherit;}

    .header{background:linear-gradient(135deg,#2D1B6B 0%,#4A2FA0 100%);color:#fff;padding:16px 16px 14px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:100;}
    .header-title{font-size:18px;font-weight:700;}
    .header-sub{font-size:11px;opacity:.7;margin-top:2px;}
    .header-btns{display:flex;gap:8px;align-items:center;}
    .btn-export{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.3);color:#fff;border-radius:8px;padding:7px 10px;font-size:12px;font-weight:600;}
    .btn-add-header{background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.35);color:#fff;border-radius:8px;padding:7px 12px;font-size:13px;font-weight:600;}

    .tabbar{display:flex;background:#fff;border-bottom:1px solid #E8E8F0;position:sticky;top:58px;z-index:99;overflow-x:auto;}
    .tab{flex:1;min-width:60px;padding:10px 4px;font-size:12px;font-weight:500;background:none;border:none;color:#888;border-bottom:2px solid transparent;white-space:nowrap;}
    .tab.active{color:#4A2FA0;border-bottom:2px solid #4A2FA0;font-weight:700;}

    .page{padding:14px 12px;padding-bottom:90px;}
    .sec-label{font-size:11px;font-weight:700;letter-spacing:1px;color:#999;text-transform:uppercase;margin-bottom:8px;margin-top:4px;}

    .wallet-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px;}
    .wallet-card{border-radius:10px;padding:12px 14px;box-shadow:0 1px 4px rgba(0,0,0,.06);}
    .wallet-name{font-size:11px;font-weight:700;margin-bottom:4px;}
    .wallet-bal{font-size:15px;font-weight:800;margin-bottom:4px;}
    .wallet-sub{font-size:10px;color:#777;}

    .total-card{background:#fff;border-radius:12px;padding:14px 16px;box-shadow:0 1px 6px rgba(0,0,0,.07);margin-bottom:14px;}
    .total-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;}
    .dp-card{background:#fff5f5;border:1px solid #f5c6c6;border-radius:12px;padding:14px 16px;margin-bottom:14px;}
    .dp-title{font-size:13px;font-weight:700;color:#c0392b;margin-bottom:8px;display:flex;align-items:center;gap:6px;}
    .dp-badge{background:#c0392b;color:#fff;font-size:10px;font-weight:700;padding:2px 8px;border-radius:20px;}

    .tx-row{background:#fff;border-radius:10px;padding:11px 12px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 1px 3px rgba(0,0,0,.05);border-left:3px solid #ccc;}
    .tx-row.dp-tx{border-left:3px solid #c0392b;background:#fff8f8;}
    .tx-left{flex:1;min-width:0;}
    .tx-cat{font-size:14px;font-weight:600;color:#222;margin-bottom:3px;}
    .tx-cat.dp{color:#c0392b;}
    .tx-meta{display:flex;flex-wrap:wrap;gap:4px;align-items:center;}
    .tx-badge{font-size:10px;font-weight:700;padding:2px 7px;border-radius:20px;}
    .tx-badge.dp{background:#fdeaea;color:#c0392b;}
    .tx-date{font-size:11px;color:#999;}
    .tx-note{font-size:11px;color:#bbb;font-style:italic;}
    .tx-right{display:flex;align-items:center;gap:8px;margin-left:8px;}
    .tx-amt{font-size:14px;font-weight:700;white-space:nowrap;}
    .tx-transfer{font-size:11px;color:#7C6FCD;font-weight:600;}
    .btn-trash{background:none;border:none;color:#ccc;padding:2px;font-size:16px;}

    .empty{text-align:center;color:#bbb;font-size:14px;padding:30px 0;}
    .see-all{display:block;text-align:center;background:none;border:none;color:#4A2FA0;font-size:13px;font-weight:600;margin-top:8px;width:100%;padding:8px;}

    .filter-row{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap;}
    .filter-input{flex:1;min-width:80px;padding:7px 8px;border-radius:8px;border:1px solid #ddd;font-size:12px;background:#fff;}
    .period-bar{background:#fff;border-radius:8px;padding:8px 12px;display:flex;gap:8px;align-items:center;margin-bottom:12px;font-size:12px;font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.05);flex-wrap:wrap;}

    .card{background:#fff;border-radius:14px;padding:18px 16px;box-shadow:0 2px 8px rgba(0,0,0,.07);}
    .type-toggle{display:flex;border-radius:10px;overflow:hidden;border:1px solid #e0e0e0;margin-bottom:16px;}
    .type-btn{flex:1;padding:10px 0;font-size:12px;font-weight:600;background:#f5f5f5;border:none;color:#888;}
    .type-btn.income.active{background:#e8f7f0;color:#1a7a4a;}
    .type-btn.expense.active{background:#fdeaea;color:#c0392b;}
    .type-btn.transfer.active{background:#eeeeff;color:#4A2FA0;}
    .form-label{display:block;font-size:12px;font-weight:600;color:#555;margin-bottom:5px;margin-top:12px;}
    .form-select,.form-input{width:100%;padding:10px 12px;border-radius:8px;border:1px solid #ddd;font-size:14px;background:#fff;}
    .btn-submit{width:100%;margin-top:20px;padding:13px 0;background:linear-gradient(135deg,#2D1B6B,#4A2FA0);color:#fff;border:none;border-radius:10px;font-size:15px;font-weight:700;}
    .btn-submit:disabled{opacity:.4;}
    .transfer-arrow{text-align:center;font-size:22px;margin:8px 0;}

    .overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:999;}
    .modal{background:#fff;border-radius:14px;padding:22px 20px;width:290px;box-shadow:0 8px 30px rgba(0,0,0,.2);}
    .modal-title{font-size:16px;font-weight:700;color:#222;margin-bottom:6px;}
    .modal-sub{font-size:13px;color:#888;margin-bottom:18px;}
    .modal-btns{display:flex;gap:10px;}
    .btn-cancel{flex:1;padding:10px 0;border-radius:8px;background:#f0f0f0;border:none;font-size:14px;font-weight:600;color:#555;}
    .btn-delete{flex:1;padding:10px 0;border-radius:8px;background:#c0392b;border:none;font-size:14px;font-weight:600;color:#fff;}

    .bottom-nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:#fff;border-top:1px solid #eee;display:flex;z-index:100;padding-bottom:env(safe-area-inset-bottom);}
    .nav-btn{flex:1;padding:8px 0 6px;display:flex;flex-direction:column;align-items:center;gap:2px;background:none;border:none;font-size:9px;font-weight:600;color:#aaa;}
    .nav-btn.active{color:#4A2FA0;}
    .nav-icon{font-size:18px;line-height:1;}

    .color-green{color:#1a7a4a;}
    .color-red{color:#c0392b;}
    .color-purple{color:#4A2FA0;}
    .fw700{font-weight:700;}
    .fs13{font-size:13px;}
    .fs12{font-size:12px;}

    .chart-card{background:#fff;border-radius:12px;padding:16px;box-shadow:0 1px 6px rgba(0,0,0,.07);margin-bottom:14px;}
    .chart-title{font-size:13px;font-weight:700;color:#555;margin-bottom:12px;}
    .donut-wrap{display:flex;justify-content:center;margin-bottom:8px;}
    canvas{max-width:200px;max-height:200px;}
    .legend-list{width:100%;margin-top:10px;}
    .legend-item{display:flex;align-items:center;justify-content:space-between;padding:6px 0;border-bottom:1px solid #f0f0f0;}
    .legend-left{display:flex;align-items:center;gap:8px;}
    .legend-dot{width:11px;height:11px;border-radius:50%;flex-shrink:0;}
    .legend-name{font-size:12px;color:#333;}
    .legend-right{text-align:right;}
    .legend-amt{font-size:12px;font-weight:700;color:#333;}
    .legend-pct{font-size:10px;color:#999;}
    .chart-empty{text-align:center;color:#bbb;font-size:14px;padding:30px 0;}
    .bar-row{margin-bottom:11px;}
    .bar-label{display:flex;justify-content:space-between;margin-bottom:3px;}
    .bar-track{background:#f0f0f0;border-radius:6px;height:8px;overflow:hidden;}
    .bar-fill{height:100%;border-radius:6px;}
  </style>
</head>
<body>
<div id="app"></div>
<script>
// ─── DATA ───────────────────────────────────────────────────────
const WALLETS = [
  {id:"pribadi",  label:"Pribadi",        color:"#7C6FCD", bg:"#EEF0FF"},
  {id:"wo",       label:"Rushtic WO",     color:"#2D9B6F", bg:"#E8F7F0"},
  {id:"decor",    label:"Rushtic Decor",  color:"#C4783A", bg:"#FDF0E6"},
  {id:"freelance",label:"Freelance Lain", color:"#B04E6F", bg:"#FDEEF3"},
  {id:"emas",     label:"🪙 Emas",        color:"#B8860B", bg:"#FFFBE6"},
];

const INCOME_CAT = {
  pribadi:   ["Jatah Suami","DP 🔴","Sumber Lain"],
  wo:        ["Rushtic WO","DP 🔴","Sumber Lain"],
  decor:     ["Rushtic Decor","DP 🔴","Sumber Lain"],
  freelance: ["MC","Mengajar","DP 🔴","Sumber Lain"],
  emas:      [],
};

const EXPENSE_CAT = {
  pribadi:  ["Makan Sehari-hari","Jajan Hanan","Kebutuhan Harian","Listrik","Pulsa","Shodaqoh","Jatah Ibu","Keperluan Pribadi Aan","Kesehatan","Marketing","Lain-lain"],
  wo:       ["Bayar Karyawan Freelance","Administrasi","Keperluan Wedding","Bayar Vendor","Marketing","Lain-lain"],
  decor:    ["Bayar Tim","Bunga Segar","Properti Dekor","Transportasi","Konsumsi","Marketing","Lain-lain"],
  freelance:["Keperluan Freelance","Marketing","Lain-lain"],
  emas:     ["Beli Emas"],
};

const isDP = t => t.category && t.category.startsWith("DP");

// ─── STORAGE ────────────────────────────────────────────────────
const KEY = "rushtic_finance_v2";
let transactions = [];
try { transactions = JSON.parse(localStorage.getItem(KEY)||"[]"); } catch(e){}
const persist = () => localStorage.setItem(KEY, JSON.stringify(transactions));

// ─── HELPERS ────────────────────────────────────────────────────
const fmt    = n  => "Rp "+Math.abs(n).toLocaleString("id-ID");
const today  = () => new Date().toISOString().split("T")[0];
const month  = () => today().slice(0,7);
const uid    = () => Date.now().toString(36)+Math.random().toString(36).slice(2);
const wColor = id => (WALLETS.find(w=>w.id===id)||{}).color||"#888";
const wBg    = id => (WALLETS.find(w=>w.id===id)||{}).bg   ||"#f5f5f5";
const wLabel = id => (WALLETS.find(w=>w.id===id)||{}).label||id;
const walletBal = (id, txList) => txList
  .filter(t=>t.wallet===id||t.toWallet===id)
  .reduce((a,t)=>{
    if(t.type==="transfer"){
      if(t.wallet===id) return a-t.amount;
      if(t.toWallet===id) return a+t.amount;
    }
    return a+(t.wallet===id?(t.type==="income"?t.amount:-t.amount):0);
  },0);

// ─── STATE ──────────────────────────────────────────────────────
let state = {
  tab:"dashboard",
  filterWallet:"all", filterType:"all", filterMonth:month(),
  chartWallet:"all", chartMonth:month(),
  deleteId:null,
  form:{mode:"income", wallet:"pribadi", toWallet:"pribadi", type:"income", category:"", amount:"", note:"", date:today()},
};

// ─── EXPORT CSV ─────────────────────────────────────────────────
function exportCSV(){
  if(!transactions.length){alert("Belum ada data.");return;}
  const rows=[["Tanggal","Dompet","Jenis","Kategori","Ke Dompet","Jumlah","Catatan"]];
  transactions.forEach(t=>rows.push([
    t.date, wLabel(t.wallet),
    t.type==="transfer"?"Transfer":t.type==="income"?"Pemasukan":"Pengeluaran",
    t.category||"-", t.toWallet?wLabel(t.toWallet):"-", t.amount, t.note||""
  ]));
  const csv=rows.map(r=>r.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(",")).join("\n");
  const blob=new Blob(["\uFEFF"+csv],{type:"text/csv;charset=utf-8;"});
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a");
  a.href=url;a.download=`keuangan-rushtic-${today()}.csv`;a.click();
  URL.revokeObjectURL(url);
}

// ─── TX ROW ─────────────────────────────────────────────────────
function txRowHTML(t){
  const dp = isDP(t);
  const isTransfer = t.type==="transfer";
  return `
  <div class="tx-row${dp?" dp-tx":""}" style="border-left-color:${isTransfer?"#7C6FCD":wColor(t.wallet)}">
    <div class="tx-left">
      <div class="tx-cat${dp?" dp":""}">${isTransfer?"🔄 Transfer":t.category}${dp?' <span class="tx-badge dp">UANG PANAS</span>':""}</div>
      <div class="tx-meta">
        <span class="tx-badge" style="background:${wBg(t.wallet)};color:${wColor(t.wallet)}">${wLabel(t.wallet)}</span>
        ${isTransfer?`<span style="font-size:11px;color:#7C6FCD">→ ${wLabel(t.toWallet)}</span>`:""}
        <span class="tx-date">${t.date}</span>
        ${t.note?`<span class="tx-note">${t.note}</span>`:""}
      </div>
    </div>
    <div class="tx-right">
      <span class="tx-amt" style="color:${isTransfer?"#7C6FCD":dp?"#c0392b":t.type==="income"?"#1a7a4a":"#c0392b"}">
        ${isTransfer?"⇄":t.type==="income"?"+":"−"}${fmt(t.amount)}
      </span>
      <button class="btn-trash" onclick="confirmDelete('${t.id}')">🗑</button>
    </div>
  </div>`;
}

// ─── RENDER ─────────────────────────────────────────────────────
function render(){
  const app=document.getElementById("app");
  const {tab,form,filterWallet,filterType,filterMonth,deleteId}=state;

  // ── filtered history ──
  const filtered=transactions.filter(t=>{
    if(filterWallet!=="all"&&t.wallet!==filterWallet&&t.toWallet!==filterWallet) return false;
    if(filterType!=="all"&&t.type!==filterType) return false;
    if(filterMonth&&!t.date.startsWith(filterMonth)) return false;
    return true;
  });
  const pIn  = filtered.filter(t=>t.type==="income" ).reduce((a,t)=>a+t.amount,0);
  const pOut = filtered.filter(t=>t.type==="expense").reduce((a,t)=>a+t.amount,0);

  // ── totals ──
  const totalIn  = transactions.filter(t=>t.type==="income" ).reduce((a,t)=>a+t.amount,0);
  const totalOut = transactions.filter(t=>t.type==="expense").reduce((a,t)=>a+t.amount,0);
  const totalBal = totalIn-totalOut;
  const totalDP  = transactions.filter(t=>isDP(t)).reduce((a,t)=>a+t.amount,0);

  // ── form categories ──
  const cats = form.mode==="income" ? INCOME_CAT[form.wallet]||[] : form.mode==="expense" ? EXPENSE_CAT[form.wallet]||[] : [];

  // ══ DASHBOARD ══
  const dashHTML=`<div class="page">
    <div class="sec-label">Saldo per Dompet</div>
    <div class="wallet-grid">
      ${WALLETS.map(w=>{
        const bal=walletBal(w.id,transactions);
        const wIn =transactions.filter(t=>t.wallet===w.id&&t.type==="income").reduce((a,t)=>a+t.amount,0);
        const wOut=transactions.filter(t=>t.wallet===w.id&&t.type==="expense").reduce((a,t)=>a+t.amount,0);
        return `<div class="wallet-card" style="background:${w.bg};border-left:4px solid ${w.color}">
          <div class="wallet-name" style="color:${w.color}">${w.label}</div>
          <div class="wallet-bal" style="color:${bal>=0?"#1a7a4a":"#c0392b"}">${bal<0?"−":""}${fmt(bal)}</div>
          <div class="wallet-sub"><span style="color:#2D9B6F">▲${fmt(wIn)}</span> <span style="color:#c0392b">▼${fmt(wOut)}</span></div>
        </div>`;
      }).join("")}
    </div>

    <div class="total-card">
      <div class="total-row"><span style="font-size:14px;font-weight:700;color:#333">Total Saldo</span>
        <span style="font-size:18px;font-weight:800;color:${totalBal>=0?"#1a7a4a":"#c0392b"}">${totalBal<0?"−":""}${fmt(totalBal)}</span></div>
      <div class="total-row"><span class="fs12 color-green">Total Pemasukan</span><span class="fw700 color-green">${fmt(totalIn)}</span></div>
      <div class="total-row"><span class="fs12 color-red">Total Pengeluaran</span><span class="fw700 color-red">${fmt(totalOut)}</span></div>
      <div style="border-top:1px solid #f0f0f0;margin:8px 0 4px"></div>
      <div class="total-row">
        <span style="font-size:13px;font-weight:700;color:#B8860B">🪙 Total Emas</span>
        <span style="font-size:16px;font-weight:800;color:#B8860B">${fmt(walletBal("emas",transactions))}</span>
      </div>
    </div>

    ${totalDP>0?`<div class="dp-card">
      <div class="dp-title">🔴 Uang Panas (DP Klien) <span class="dp-badge">JANGAN DIPAKAI</span></div>
      <div style="font-size:20px;font-weight:800;color:#c0392b">${fmt(totalDP)}</div>
      <div style="font-size:11px;color:#e07070;margin-top:4px">${transactions.filter(t=>isDP(t)).length} transaksi DP aktif</div>
    </div>`:""}

    <div class="sec-label">Transaksi Terakhir</div>
    ${transactions.length===0?'<div class="empty">Belum ada transaksi.</div>':transactions.slice(0,5).map(txRowHTML).join("")}
    ${transactions.length>5?`<button class="see-all" onclick="setTab('history')">Lihat Semua →</button>`:""}
  </div>`;

  // ══ HISTORY ══
  const histHTML=`<div class="page">
    <div class="filter-row">
      <input type="month" class="filter-input" value="${filterMonth}" onchange="setFilter('filterMonth',this.value)"/>
      <select class="filter-input" onchange="setFilter('filterWallet',this.value)">
        <option value="all" ${filterWallet==="all"?"selected":""}>Semua Dompet</option>
        ${WALLETS.map(w=>`<option value="${w.id}" ${filterWallet===w.id?"selected":""}>${w.label}</option>`).join("")}
      </select>
      <select class="filter-input" onchange="setFilter('filterType',this.value)">
        <option value="all" ${filterType==="all"?"selected":""}>Semua</option>
        <option value="income" ${filterType==="income"?"selected":""}>Pemasukan</option>
        <option value="expense" ${filterType==="expense"?"selected":""}>Pengeluaran</option>
        <option value="transfer" ${filterType==="transfer"?"selected":""}>Transfer</option>
      </select>
    </div>
    <div class="period-bar">
      <span class="color-green">▲${fmt(pIn)}</span>
      <span style="color:#ccc">|</span>
      <span class="color-red">▼${fmt(pOut)}</span>
      <span style="color:#ccc">|</span>
      <span class="fw700" style="color:${pIn-pOut>=0?"#1a7a4a":"#c0392b"}">${pIn-pOut<0?"−":""}${fmt(pIn-pOut)}</span>
    </div>
    ${filtered.length===0?'<div class="empty">Tidak ada transaksi.</div>':filtered.map(txRowHTML).join("")}
  </div>`;

  // ══ ADD FORM ══
  const addHTML=`<div class="page"><div class="card">
    <div class="type-toggle">
      <button class="type-btn income ${form.mode==="income"?"active":""}" onclick="setMode('income')">▲ Masuk</button>
      <button class="type-btn expense ${form.mode==="expense"?"active":""}" onclick="setMode('expense')">▼ Keluar</button>
      <button class="type-btn transfer ${form.mode==="transfer"?"active":""}" onclick="setMode('transfer')">⇄ Transfer</button>
    </div>

    ${form.mode==="transfer"?`
      <label class="form-label">Dari Dompet</label>
      <select class="form-select" onchange="setFormField('wallet',this.value)">
        ${WALLETS.map(w=>`<option value="${w.id}" ${form.wallet===w.id?"selected":""}>${w.label}</option>`).join("")}
      </select>
      <div class="transfer-arrow">↓</div>
      <label class="form-label">Ke Dompet</label>
      <select class="form-select" onchange="setFormField('toWallet',this.value)">
        ${WALLETS.filter(w=>w.id!==form.wallet).map(w=>`<option value="${w.id}" ${form.toWallet===w.id?"selected":""}>${w.label}</option>`).join("")}
      </select>
    `:`
      <label class="form-label">Dompet</label>
      <select class="form-select" onchange="setFormWallet(this.value)">
        ${WALLETS.filter(w=>w.id!=="emas"||form.mode==="expense").map(w=>`<option value="${w.id}" ${form.wallet===w.id?"selected":""}>${w.label}</option>`).join("")}
      </select>
      <label class="form-label">Kategori</label>
      <select class="form-select" onchange="setFormField('category',this.value)">
        <option value="">-- Pilih Kategori --</option>
        ${cats.map(c=>`<option value="${c}" ${form.category===c?"selected":""}>${c}</option>`).join("")}
      </select>
    `}

    <label class="form-label">Jumlah (Rp)</label>
    <input type="number" inputmode="numeric" class="form-input" id="inp-amount" placeholder="0" value="${form.amount}" onblur="setFormField('amount',this.value)"/>
    <label class="form-label">Tanggal</label>
    <input type="date" class="form-input" value="${form.date}" onchange="setFormField('date',this.value)"/>
    <label class="form-label">Catatan (opsional)</label>
    <input type="text" class="form-input" placeholder="${form.mode==="transfer"?"Misal: pindah untuk bayar emas":"Misal: bayar katering Bu Ari"}" value="${form.note}" onblur="setFormField('note',this.value)"/>
    <button class="btn-submit" onclick="addTx()" ${(!form.amount||(form.mode!=="transfer"&&!form.category))?"disabled":""}>Simpan</button>
  </div></div>`;

  // ══ CHART ══
  const cTx=transactions.filter(t=>{
    if(state.chartWallet!=="all"&&t.wallet!==state.chartWallet) return false;
    if(state.chartMonth&&!t.date.startsWith(state.chartMonth)) return false;
    return true;
  });
  const expTx=cTx.filter(t=>t.type==="expense");
  const catMap={};
  expTx.forEach(t=>{catMap[t.category]=(catMap[t.category]||0)+t.amount;});
  const catEntries=Object.entries(catMap).sort((a,b)=>b[1]-a[1]);
  const totalExp=catEntries.reduce((a,c)=>a+c[1],0);
  const dpTx=cTx.filter(t=>isDP(t));
  const totalDPChart=dpTx.reduce((a,t)=>a+t.amount,0);
  const COLORS=["#4A2FA0","#2D9B6F","#C4783A","#B04E6F","#3A85C4","#9B2D7A","#6FC47A","#C4A23A","#3AC4B4","#A03A3A","#7C6FCD","#6FB87C"];

  const chartHTML=`<div class="page">
    <div class="chart-card">
      <div class="chart-title">Filter Bagan</div>
      <div class="filter-row">
        <input type="month" class="filter-input" value="${state.chartMonth}" onchange="setChartFilter('chartMonth',this.value)"/>
        <select class="filter-input" onchange="setChartFilter('chartWallet',this.value)">
          <option value="all" ${state.chartWallet==="all"?"selected":""}>Semua Dompet</option>
          ${WALLETS.map(w=>`<option value="${w.id}" ${state.chartWallet===w.id?"selected":""}>${w.label}</option>`).join("")}
        </select>
      </div>
    </div>

    ${totalDPChart>0?`<div class="dp-card">
      <div class="dp-title">🔴 Uang Panas Periode Ini</div>
      <div style="font-size:20px;font-weight:800;color:#c0392b">${fmt(totalDPChart)}</div>
      <div style="font-size:11px;color:#e07070;margin-top:4px">${dpTx.length} transaksi DP</div>
    </div>`:""}

    <div class="chart-card">
      <div class="chart-title">Pengeluaran per Kategori</div>
      ${totalExp===0?`<div class="chart-empty">Belum ada pengeluaran.</div>`:`
        <div class="donut-wrap"><canvas id="donutChart" width="200" height="200"></canvas></div>
        <div class="legend-list">
          ${catEntries.map(([cat,amt],i)=>`
            <div class="legend-item">
              <div class="legend-left">
                <div class="legend-dot" style="background:${COLORS[i%COLORS.length]}"></div>
                <span class="legend-name">${cat}</span>
              </div>
              <div class="legend-right">
                <div class="legend-amt">${fmt(amt)}</div>
                <div class="legend-pct">${((amt/totalExp)*100).toFixed(1)}%</div>
              </div>
            </div>`).join("")}
        </div>`}
    </div>

    <div class="chart-card">
      <div class="chart-title">Pengeluaran per Dompet</div>
      ${WALLETS.map(w=>{
        const amt=cTx.filter(t=>t.wallet===w.id&&t.type==="expense").reduce((a,t)=>a+t.amount,0);
        const pct=totalExp>0?((amt/totalExp)*100).toFixed(1):0;
        return `<div class="bar-row">
          <div class="bar-label">
            <span style="font-size:12px;font-weight:600;color:${w.color}">${w.label}</span>
            <span style="font-size:12px;font-weight:700;color:#333">${pct}% · ${fmt(amt)}</span>
          </div>
          <div class="bar-track"><div class="bar-fill" style="background:${w.color};width:${pct}%"></div></div>
        </div>`;
      }).join("")}
    </div>
  </div>`;

  // ══ MODAL ══
  const modalHTML=deleteId?`<div class="overlay">
    <div class="modal">
      <div class="modal-title">Hapus transaksi ini?</div>
      <div class="modal-sub">Tidak bisa dibatalkan.</div>
      <div class="modal-btns">
        <button class="btn-cancel" onclick="cancelDelete()">Batal</button>
        <button class="btn-delete" onclick="doDelete()">Hapus</button>
      </div>
    </div>
  </div>`:"";

  app.innerHTML=`
    <div class="header">
      <div>
        <div class="header-title">Keuangan Rushtic</div>
        <div class="header-sub">Finance Tracker</div>
      </div>
      <div class="header-btns">
        <button class="btn-export" onclick="exportCSV()">↓ CSV</button>
        <button class="btn-add-header" onclick="setTab('add')">＋ Tambah</button>
      </div>
    </div>
    <div class="tabbar">
      <button class="tab ${tab==="dashboard"?"active":""}" onclick="setTab('dashboard')">Dashboard</button>
      <button class="tab ${tab==="history"?"active":""}"   onclick="setTab('history')">Riwayat</button>
      <button class="tab ${tab==="chart"?"active":""}"     onclick="setTab('chart')">Bagan</button>
      <button class="tab ${tab==="add"?"active":""}"       onclick="setTab('add')">Tambah</button>
    </div>
    ${tab==="dashboard"?dashHTML:tab==="history"?histHTML:tab==="chart"?chartHTML:addHTML}
    ${modalHTML}
    <div class="bottom-nav">
      <button class="nav-btn ${tab==="dashboard"?"active":""}" onclick="setTab('dashboard')"><span class="nav-icon">🏠</span>Dashboard</button>
      <button class="nav-btn ${tab==="history"?"active":""}"   onclick="setTab('history')"><span class="nav-icon">📋</span>Riwayat</button>
      <button class="nav-btn ${tab==="chart"?"active":""}"     onclick="setTab('chart')"><span class="nav-icon">📊</span>Bagan</button>
      <button class="nav-btn ${tab==="add"?"active":""}"       onclick="setTab('add')"><span class="nav-icon">➕</span>Tambah</button>
    </div>`;
}

// ─── ACTIONS ────────────────────────────────────────────────────
function setTab(t){state.tab=t;render();if(t==="chart")setTimeout(drawDonut,50);}
function setFilter(k,v){state[k]=v;render();}
function setChartFilter(k,v){state[k]=v;render();setTimeout(drawDonut,50);}
function setMode(m){
  state.form={...state.form,mode:m,type:m==="transfer"?"transfer":m,category:"",
    toWallet:m==="transfer"?(state.form.wallet==="emas"?"pribadi":state.form.toWallet):"pribadi"};
  render();
}
function setFormWallet(w){state.form={...state.form,wallet:w,category:""};render();}
function setFormField(k,v){state.form={...state.form,[k]:v};render();}

function addTx(){
  const f=state.form;
  if(!f.amount) return;
  if(f.mode!=="transfer"&&!f.category) return;
  if(f.mode==="transfer"&&f.wallet===f.toWallet){alert("Dompet asal dan tujuan tidak boleh sama.");return;}
  const tx={
    id:uid(), date:f.date, wallet:f.wallet,
    type:f.mode==="transfer"?"transfer":f.mode,
    category:f.mode==="transfer"?"Transfer":f.category,
    amount:parseFloat(f.amount), note:f.note,
  };
  if(f.mode==="transfer") tx.toWallet=f.toWallet;
  transactions.unshift(tx);
  persist();
  state.form={...f,category:"",amount:"",note:"",date:today()};
  state.tab="history";
  render();
}

function confirmDelete(id){state.deleteId=id;render();}
function cancelDelete(){state.deleteId=null;render();}
function doDelete(){
  transactions=transactions.filter(t=>t.id!==state.deleteId);
  persist();
  state.deleteId=null;
  render();
}

// ─── DONUT CHART ────────────────────────────────────────────────
function drawDonut(){
  const canvas=document.getElementById("donutChart");
  if(!canvas)return;
  const ctx=canvas.getContext("2d");
  const W=canvas.width,H=canvas.height;
  ctx.clearRect(0,0,W,H);
  const cTx=transactions.filter(t=>{
    if(state.chartWallet!=="all"&&t.wallet!==state.chartWallet)return false;
    if(state.chartMonth&&!t.date.startsWith(state.chartMonth))return false;
    return true;
  });
  const catMap={};
  cTx.filter(t=>t.type==="expense").forEach(t=>{catMap[t.category]=(catMap[t.category]||0)+t.amount;});
  const entries=Object.entries(catMap).sort((a,b)=>b[1]-a[1]);
  const total=entries.reduce((a,c)=>a+c[1],0);
  if(!total)return;
  const COLORS=["#4A2FA0","#2D9B6F","#C4783A","#B04E6F","#3A85C4","#9B2D7A","#6FC47A","#C4A23A","#3AC4B4","#A03A3A","#7C6FCD","#6FB87C"];
  const cx=W/2,cy=H/2,r=88,inner=50;
  let angle=-Math.PI/2;
  entries.forEach(([,amt],i)=>{
    const slice=(amt/total)*2*Math.PI;
    ctx.beginPath();ctx.moveTo(cx,cy);ctx.arc(cx,cy,r,angle,angle+slice);ctx.closePath();
    ctx.fillStyle=COLORS[i%COLORS.length];ctx.fill();
    angle+=slice;
  });
  ctx.beginPath();ctx.arc(cx,cy,inner,0,2*Math.PI);ctx.fillStyle="#fff";ctx.fill();
  ctx.fillStyle="#333";ctx.font="bold 12px 'Segoe UI',sans-serif";ctx.textAlign="center";ctx.textBaseline="middle";
  ctx.fillText("Pengeluaran",cx,cy-8);
  ctx.font="11px 'Segoe UI',sans-serif";ctx.fillStyle="#888";
  ctx.fillText(entries.length+" kategori",cx,cy+9);
}

// ─── SERVICE WORKER ─────────────────────────────────────────────
if('serviceWorker' in navigator){
  window.addEventListener('load',()=>{
    navigator.serviceWorker.register('/keuangan/sw.js').catch(e=>console.log('SW:',e));
  });
}

render();
</script>
