<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --sage: #7a9e87;
    --sage-dark: #5c7d69;
    --sage-light: #a8c4b0;
    --sage-pale: #deeae2;
    --cream: #f7f4ef;
    --cream-dark: #ede8e0;
    --text: #2d3a31;
    --text-muted: #6b7c6e;
    --white: #ffffff;
    --shadow: 0 4px 24px rgba(90,120,90,0.10);
    --shadow-lg: 0 8px 40px rgba(90,120,90,0.18);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'DM Sans', sans-serif; background: var(--cream); color: var(--text); min-height: 100vh; }

  /* LOADING OVERLAY */
  .overlay {
    position: fixed; inset: 0;
    background: rgba(247,244,239,0.92);
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    z-index: 9999;
    gap: 16px;
    transition: opacity 0.4s;
  }
  .overlay.hidden { opacity: 0; pointer-events: none; }
  .spinner {
    width: 40px; height: 40px;
    border: 3px solid var(--sage-pale);
    border-top-color: var(--sage-dark);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .overlay-text { font-size: 14px; color: var(--sage-dark); font-weight: 500; }

  /* ROLE SELECTOR */
  .role-selector {
    position: fixed; inset: 0;
    background: var(--cream);
    z-index: 500;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 40px 20px 60px;
  }
  .role-selector.hidden { display: none; }
  .selector-logo { font-size: 11px; letter-spacing: 3px; color: var(--text-muted); text-transform: uppercase; margin-bottom: 8px; }
  .selector-title { font-family: 'Playfair Display', serif; font-size: 26px; color: var(--sage-dark); font-weight: 700; text-align: center; margin-bottom: 6px; }
  .selector-sub { font-size: 13px; color: var(--text-muted); text-align: center; margin-bottom: 32px; }
  .role-cards { display: flex; flex-direction: column; gap: 12px; width: 100%; max-width: 480px; }
  .role-card {
    background: var(--white);
    border-radius: 16px;
    padding: 18px 20px;
    display: flex; align-items: center; gap: 16px;
    cursor: pointer;
    border: 2px solid transparent;
    box-shadow: var(--shadow);
    transition: all 0.2s;
    user-select: none;
  }
  .role-card:hover { border-color: var(--sage-light); box-shadow: var(--shadow-lg); transform: translateY(-1px); }
  .role-card-icon { font-size: 26px; flex-shrink: 0; }
  .role-card-info { flex: 1; }
  .role-card-name { font-size: 16px; font-weight: 600; color: var(--text); }
  .role-card-desc { font-size: 12px; color: var(--text-muted); margin-top: 2px; }
  .role-card-badge {
    font-size: 11px; font-weight: 600;
    background: var(--sage-pale); color: var(--sage-dark);
    border-radius: 99px; padding: 3px 10px;
    flex-shrink: 0;
  }
  .role-card-badge.done { background: var(--sage-dark); color: white; }

  /* COORDINATOR BADGE */
  .coord-card { border: 2px solid var(--sage-pale); }

  /* HEADER */
  .header {
    background: linear-gradient(135deg, var(--sage-dark) 0%, var(--sage) 60%, var(--sage-light) 100%);
    padding: 36px 24px 28px;
    position: relative; overflow: hidden;
  }
  .header-top { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; }
  .back-btn {
    background: rgba(255,255,255,0.2);
    border: none; border-radius: 10px;
    padding: 8px 14px; color: white;
    font-size: 13px; font-weight: 500;
    cursor: pointer; font-family: 'DM Sans', sans-serif;
    flex-shrink: 0;
  }
  .back-btn:hover { background: rgba(255,255,255,0.3); }
  .header-info { flex: 1; }
  .header-logo { font-size: 10px; letter-spacing: 3px; color: rgba(255,255,255,0.65); text-transform: uppercase; }
  .header-role { font-family: 'Playfair Display', serif; font-size: 22px; color: white; font-weight: 700; line-height: 1.2; }
  .header-event { font-size: 12px; color: rgba(255,255,255,0.7); margin-top: 4px; }

  .sync-status {
    display: inline-flex; align-items: center; gap: 6px;
    background: rgba(255,255,255,0.15);
    border-radius: 99px; padding: 5px 12px;
    font-size: 12px; color: rgba(255,255,255,0.85);
  }
  .sync-dot { width: 7px; height: 7px; border-radius: 50%; background: #4ade80; flex-shrink: 0; }
  .sync-dot.syncing { background: #fbbf24; animation: pulse 1s infinite; }
  .sync-dot.error { background: #f87171; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }

  /* PROGRESS */
  .progress-bar-wrap {
    background: var(--cream-dark);
    padding: 12px 20px;
    display: flex; align-items: center; gap: 12px;
    border-bottom: 1px solid var(--sage-pale);
    position: sticky; top: 0; z-index: 100;
    box-shadow: 0 2px 12px rgba(0,0,0,0.06);
  }
  .progress-label { font-size: 12px; font-weight: 500; color: var(--sage-dark); white-space: nowrap; }
  .progress-track { flex: 1; height: 7px; background: var(--sage-pale); border-radius: 99px; overflow: hidden; }
  .progress-fill { height: 100%; background: linear-gradient(90deg, var(--sage-dark), var(--sage-light)); border-radius: 99px; transition: width 0.4s ease; }
  .progress-pct { font-size: 13px; font-weight: 600; color: var(--sage-dark); min-width: 34px; text-align: right; }

  /* MAIN */
  .main { max-width: 640px; margin: 0 auto; padding: 24px 16px 100px; }

  /* TASK */
  .task-list { display: flex; flex-direction: column; gap: 10px; margin-bottom: 24px; }
  .task-item {
    background: var(--white); border-radius: 14px; padding: 14px 16px;
    display: flex; align-items: flex-start; gap: 12px;
    cursor: pointer; border: 2px solid transparent;
    box-shadow: var(--shadow); transition: all 0.2s; user-select: none;
  }
  .task-item:hover { border-color: var(--sage-pale); }
  .task-item.checked { background: #f0f7f2; border-color: var(--sage-light); }
  .task-checkbox {
    width: 22px; height: 22px; border: 2.5px solid var(--sage-light);
    border-radius: 7px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.2s; margin-top: 1px;
  }
  .task-item.checked .task-checkbox { background: var(--sage-dark); border-color: var(--sage-dark); }
  .task-checkbox svg { display: none; }
  .task-item.checked .task-checkbox svg { display: block; }
  .task-text { font-size: 14px; line-height: 1.55; color: var(--text); flex: 1; }
  .task-item.checked .task-text { color: var(--text-muted); text-decoration: line-through; text-decoration-color: var(--sage-light); }

  /* CATATAN */
  .catatan-card { background: var(--white); border-radius: 18px; padding: 20px; box-shadow: var(--shadow); margin-bottom: 16px; }
  .catatan-card h3 { font-family: 'Playfair Display', serif; font-size: 17px; color: var(--sage-dark); margin-bottom: 14px; display: flex; align-items: center; gap: 8px; }
  .catatan-card h3::after { content:''; flex:1; height:1px; background: var(--sage-pale); }
  .field-group { margin-bottom: 14px; }
  .field-label { font-size: 11px; font-weight: 600; color: var(--sage-dark); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 6px; display: block; }
  .field-input, .field-textarea {
    width: 100%; border: 1.5px solid var(--sage-pale); border-radius: 10px;
    padding: 10px 13px; font-family: 'DM Sans', sans-serif;
    font-size: 14px; color: var(--text); background: var(--cream);
    outline: none; transition: border-color 0.2s; resize: none;
  }
  .field-input:focus, .field-textarea:focus { border-color: var(--sage); }
  .field-textarea { min-height: 80px; }
  .radio-group { display: flex; gap: 8px; flex-wrap: wrap; }
  .radio-btn {
    padding: 7px 14px; border-radius: 99px; border: 1.5px solid var(--sage-pale);
    font-size: 12px; cursor: pointer; transition: all 0.2s;
    background: var(--cream); color: var(--text-muted); user-select: none;
  }
  .radio-btn.selected { background: var(--sage-dark); color: white; border-color: var(--sage-dark); font-weight: 500; }

  /* ACTION BAR */
  .action-bar {
    position: fixed; bottom: 0; left: 0; right: 0;
    background: var(--white); border-top: 1px solid var(--sage-pale);
    padding: 14px 20px; display: flex; gap: 10px; justify-content: center;
    box-shadow: 0 -4px 24px rgba(0,0,0,0.08); z-index: 200;
  }
  .btn {
    padding: 12px 22px; border-radius: 12px; font-family: 'DM Sans', sans-serif;
    font-size: 14px; font-weight: 600; cursor: pointer; border: none;
    transition: all 0.2s; display: flex; align-items: center; gap: 7px;
  }
  .btn-primary { background: linear-gradient(135deg, var(--sage-dark), var(--sage)); color: white; box-shadow: 0 4px 16px rgba(90,140,100,0.3); }
  .btn-primary:hover { transform: translateY(-1px); }
  .btn-secondary { background: var(--cream-dark); color: var(--sage-dark); border: 1.5px solid var(--sage-pale); }

  /* COORDINATOR VIEW */
  .coord-section { display: none; }
  .coord-section.active { display: block; }

  .overall-progress {
    background: var(--white); border-radius: 16px; padding: 20px;
    box-shadow: var(--shadow); margin-bottom: 20px;
  }
  .overall-title { font-family: 'Playfair Display', serif; font-size: 18px; color: var(--sage-dark); margin-bottom: 14px; }
  .overall-bar { height: 10px; background: var(--sage-pale); border-radius: 99px; overflow: hidden; margin-bottom: 16px; }
  .overall-fill { height: 100%; background: linear-gradient(90deg,var(--sage-dark),var(--sage-light)); border-radius: 99px; transition: width 0.5s; }
  .role-summary-list { display: flex; flex-direction: column; gap: 10px; }
  .role-summary-item {
    background: var(--cream); border-radius: 12px; padding: 14px 16px;
    border-left: 4px solid var(--sage-light);
  }
  .role-summary-item.complete { border-left-color: var(--sage-dark); }
  .rsi-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
  .rsi-name { font-size: 14px; font-weight: 600; color: var(--text); }
  .rsi-count { font-size: 12px; color: var(--text-muted); }
  .rsi-bar { height: 5px; background: var(--sage-pale); border-radius: 99px; overflow: hidden; margin-bottom: 6px; }
  .rsi-fill { height: 100%; background: var(--sage-dark); border-radius: 99px; transition: width 0.4s; }
  .rsi-pic { font-size: 12px; color: var(--text-muted); }

  /* NOTES DETAIL */
  .notes-detail { background: var(--white); border-radius: 14px; padding: 16px; box-shadow: var(--shadow); margin-top: 10px; display: none; }
  .notes-detail.open { display: block; }
  .notes-row { margin-bottom: 10px; }
  .notes-key { font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; color: var(--sage-dark); margin-bottom: 2px; }
  .notes-val { font-size: 13px; color: var(--text); }

  /* EVENT META */
  .event-meta-card { background: var(--white); border-radius: 16px; padding: 20px; box-shadow: var(--shadow); margin-bottom: 20px; }
  .event-meta-card h3 { font-family: 'Playfair Display', serif; font-size: 17px; color: var(--sage-dark); margin-bottom: 14px; }
  .meta-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

  /* TOAST */
  .toast {
    position: fixed; top: 20px; right: 20px;
    background: var(--sage-dark); color: white;
    padding: 11px 18px; border-radius: 10px;
    font-size: 13px; font-weight: 500;
    box-shadow: var(--shadow-lg); z-index: 9998;
    display: none; animation: slideIn 0.3s ease;
  }
  @keyframes slideIn { from{opacity:0;transform:translateY(-8px)} to{opacity:1;transform:translateY(0)} }

  /* LAST UPDATED */
  .last-updated { font-size: 11px; color: var(--text-muted); text-align: center; margin-top: 12px; }

  .refresh-btn {
    background: rgba(255,255,255,0.15); border: 1px solid rgba(255,255,255,0.3);
    border-radius: 8px; color: white; font-size: 12px; padding: 5px 10px;
    cursor: pointer; font-family: 'DM Sans', sans-serif;
  }
</style>

const DATA_REF = firebase.database().ref('wo_checklist');

async function readBin() {
  const snap = await DATA_REF.get();
  return snap.exists() ? snap.val() : null;
}

async function writeBin(data) {
  data.updatedAt = new Date().toISOString();
  await DATA_REF.set(data);
  return true;
}

// ============================================================
// LOAD & SYNC
// ============================================================
async function loadData(manual = false) {
  if (manual) showToast('🔄 Memuat data terbaru...');
  setSyncStatus('syncing', 'Memuat...');
  try {
    const data = await readBin();
    appData = data || defaultData();
    setSyncStatus('ok', 'Tersambung');
    renderAll();
    if (manual) showToast('✅ Data berhasil dimuat');
  } catch(e) {
    // Walau gagal terhubung, tetap render tampilan dari data lokal/default
    if (!appData || !Object.keys(appData).length) appData = defaultData();
    setSyncStatus('error', 'Offline — data lokal');
    renderAll();
    if (manual) showToast('❌ Gagal memuat, tampil data lokal');
  }
  hideOverlay();
}

function scheduleSave() {
  pendingSync = true;
  setSyncStatus('syncing', 'Menyimpan...');
  clearTimeout(syncTimer);
  syncTimer = setTimeout(async () => {
    try {
      await writeBin(appData);
      setSyncStatus('ok', 'Tersimpan ✓');
      pendingSync = false;
    } catch(e) {
      setSyncStatus('error', 'Gagal menyimpan');
    }
  }, 1200);
}

function setSyncStatus(type, text) {
  const dot = document.getElementById('sync-dot');
  const txt = document.getElementById('sync-text');
  if (!dot) return;
  dot.className = 'sync-dot' + (type === 'syncing' ? ' syncing' : type === 'error' ? ' error' : '');
  txt.textContent = text;
}

function renderRoleSelector() {
  const container = document.getElementById('role-cards');
  container.innerHTML = ROLES.map(r => {
    const rd = appData[r.id] || { checks: [], fields: {} };
    const checked = rd.checks.length;
    const total = r.tasks.length;
    const done = checked === total;
    const picName = rd.fields.pic || '';
    return `
      <div class="role-card ${r.isCoord?'coord-card':''}" onclick="selectRole('${r.id}')">
        <div class="role-card-icon">${r.icon}</div>
        <div class="role-card-info">
          <div class="role-card-name">${r.name}</div>
          <div class="role-card-desc">${picName ? '👤 '+picName : r.desc}</div>
        </div>
        <div class="role-card-badge ${done?'done':''}">${checked}/${total}</div>
      </div>`;
  }).join('');
}

}

function renderField(roleId, f, value) {
  value = value || '';
  if (f.type === 'radio') {
    const btns = f.options.map(opt =>
      `<div class="radio-btn ${value===opt?'selected':''}" onclick="updateField('${roleId}','${f.id}','${opt}',this)">${opt}</div>`
    ).join('');
    return `<div class="field-group"><label class="field-label">${f.label}</label><div class="radio-group">${btns}</div></div>`;
  }
  if (f.type === 'textarea') {
    return `<div class="field-group"><label class="field-label">${f.label}</label><textarea class="field-textarea" placeholder="${f.placeholder||''}" oninput="updateField('${roleId}','${f.id}',this.value)">${value}</textarea></div>`;
  }
  return `<div class="field-group"><label class="field-label">${f.label}</label><input class="field-input" type="${f.type||'text'}" value="${value}" placeholder="${f.placeholder||''}" oninput="updateField('${roleId}','${f.id}',this.value)"></div>`;
}

// ============================================================
// INTERACTIONS
// ============================================================
function toggleTask(roleId, idx, el) {
  if (!appData[roleId]) appData[roleId] = { checks:[], fields:{} };
  const checks = appData[roleId].checks;
  const pos = checks.indexOf(idx);
  if (pos === -1) checks.push(idx);
  else checks.splice(pos, 1);
  el.classList.toggle('checked');
  const role = ROLES.find(r => r.id === roleId);
  updateRoleProgress(role, appData[roleId]);
  scheduleSave();
}

function updateField(roleId, fieldId, value, radioEl) {
  if (!appData[roleId]) appData[roleId] = { checks:[], fields:{} };
  if (!appData[roleId].fields) appData[roleId].fields = {};
  appData[roleId].fields[fieldId] = value;
  if (radioEl) {
    radioEl.closest('.radio-group').querySelectorAll('.radio-btn').forEach(b => b.classList.remove('selected'));
    radioEl.classList.add('selected');
  }
  scheduleSave();
}

function updateMeta(key, value) {
  if (!appData.meta) appData.meta = {};
  appData.meta[key] = value;
  const meta = appData.meta;
  const eventInfo = meta.pengantin ? `${meta.pengantin} · ${meta.tanggal||''}` : 'Isi info acara di bagian Koordinator';
  const el = document.getElementById('header-event-info');
  if (el) el.textContent = eventInfo;
  scheduleSave();
}

function updateRoleProgress(role, rd) {
  const checked = (rd.checks||[]).length;
  const total = role.tasks.length;
  const pct = Math.round((checked/total)*100);
  const pbar = document.getElementById('role-progress');
  const ppct = document.getElementById('role-pct');
  const plbl = document.getElementById('progress-label');
  if (pbar) pbar.style.width = pct + '%';
  if (ppct) ppct.textContent = pct + '%';
  if (plbl) plbl.textContent = `${checked}/${total} tugas`;
}

function updateLastUpdated() {
  const el = document.getElementById('last-updated');
  if (!el) return;
  const ts = appData.updatedAt;
  if (ts) {
    const d = new Date(ts);
    el.textContent = `Terakhir diupdate: ${d.toLocaleDateString('id-ID')} ${d.toLocaleTimeString('id-ID')}`;
  }
}
